name: pauoj

x-app-environment: &app-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgres://${POSTGRES_USER:-pauoj}:${POSTGRES_PASSWORD:-pauoj}@db:5432/${POSTGRES_DB:-pauoj}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  REDIS_URL: redis://redis:6379
  JUDGE_IMAGE: ${JUDGE_IMAGE:-pauoj/judge:latest}
  JUDGE_SWIFT_IMAGE: ${JUDGE_SWIFT_IMAGE:-pauoj/judge-swift:latest}
  JUDGE_WORK_DIR: /var/lib/pauoj/judge
  JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  MAIL_FROM: PAU OJ <noreply@pauoj.local>

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pauoj}
      POSTGRES_USER: ${POSTGRES_USER:-pauoj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pauoj}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pauoj} -d ${POSTGRES_DB:-pauoj}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      target: web
    image: pauoj/app:latest
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "node dist/migrate.js && node server.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # SSE connections are long-lived; Docker's default nofile is 1024.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Per-netns backlog floor for the custom production server.
    sysctls:
      net.core.somaxconn: 16384
      net.ipv4.tcp_max_syn_backlog: 16384
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      target: web
    image: pauoj/app:latest
    environment:
      <<: *app-environment
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JUDGE_HOST_DIR:-/var/lib/pauoj/judge}:/var/lib/pauoj/judge
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: web
    image: pauoj/app:latest
    environment:
      <<: *app-environment
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pauoj.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/seed.js"]

  judge-image:
    profiles: ["build"]
    build:
      context: ./judge
    image: pauoj/judge:latest
    entrypoint: ["/bin/true"]
    restart: "no"

  judge-swift-image:
    profiles: ["build"]
    build:
      context: ./judge
      dockerfile: Dockerfile.swift
    image: pauoj/judge-swift:latest
    entrypoint: ["/bin/true"]
    restart: "no"

volumes:
  pgdata:
  redisdata:
