<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="dc-title dc-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Noto Sans Bengali', sans-serif">
  <title id="dc-title">Module 11: Docker &amp; CI/CD concept map</title>
  <desc id="dc-desc">তিন ধাপের মানচিত্র: প্রথমে কনটেইনার, ইমেজ আর Dockerfile—layer cache আর pinned base দিয়ে প্রথম নিরাপদ বিল্ড; এরপর কম্পোজ ও প্রোডাকশন ইমেজ—healthcheck-সহ স্ট্যাক, রান টাইমে সিক্রেট আর multi-stage বিল্ড; শেষে সিআই/সিডি পাইপলাইন ও ইনসিডেন্ট—required check, migration গেট, হেলথ চেক আর রোলব্যাক।</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" opacity="0.45"/>
