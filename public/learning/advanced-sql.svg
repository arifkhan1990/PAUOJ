  <title id="sqla-title">Advanced SQL: ShopSphere analytics concept map</title>
  <desc id="sqla-desc">Six-step analytics path: window functions for rankings and rolling metrics, CTEs and recursion for trees and funnels, pivots and cohort metrics, JSON attributes with inventory reconciliation, execution plans with indexes and transactions, and finally the vendor scorecard and retention capstone.</desc>
