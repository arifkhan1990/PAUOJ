name: Deploy

on:
  # Deploy automatically after a green CI run on main. The srv host owns the
  # actual build/migrate/recreate step; this job only queues and verifies it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DEPLOY_URL: https://deploy.nabasolution.tech/deploy/pauoj
      QUEUE_URL: https://deploy.nabasolution.tech/healthz
      HEALTH_URL: https://pauoj.nabasolution.tech/health
      PUBLIC_URL: https://pauoj.nabasolution.tech

    steps:
      - name: Resolve target commit
        id: target
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${EVENT_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Skip stale CI runs
        id: guard
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(curl -fsS --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["object"]["sha"])')
          if [ "$RUN_SHA" != "$tip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main is $tip; this run is for $RUN_SHA — skipping stale deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deploy token
        id: token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_TOKEN is not set; production deploy skipped. Add the srv WEBHOOK_SECRET as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true' && steps.token.outputs.configured == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Trigger srv deploy
        if: steps.guard.outputs.skip != 'true' && steps.token.outputs.configured == 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          REF: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 --retry-delay 5 \
            -o /tmp/deploy-response.json -w "%{http_code}" -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"github-actions\",\"ref\":\"$REF\",\"branch\":\"main\"}" \
            "$DEPLOY_URL") || code=000
          cat /tmp/deploy-response.json || true
          echo
          case "$code" in
            2*) echo "Deploy queued for $REF" ;;
            *) echo "::error::deploy hook returned HTTP $code"; exit 1 ;;
          esac

      - name: Wait for the deploy queue
        if: steps.guard.outputs.skip != 'true' && steps.token.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            body=$(curl -fsS -m 10 "$QUEUE_URL" || echo '{}')
            deploying=$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("deploying") or "")' 2>/dev/null || true)
            queue=$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("queue") or 0)' 2>/dev/null || echo 0)
            echo "deploying=${deploying:-none} queue=$queue"
            if [ -z "$deploying" ] && [ "$queue" = "0" ] && [ "$i" -gt 3 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::deploy queue did not drain within 20 minutes"
          exit 1

      - name: Verify health, smoke tests and upload limit
        if: steps.guard.outputs.skip != 'true' && steps.token.outputs.configured == 'true'
        run: |
          set -euo pipefail
          expected=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          health=""
          version=""
          migrations_ok=""
          workers="0"
          for i in $(seq 1 60); do
            health=$(curl -fsS -m 10 "$HEALTH_URL" || true)
            version=$(printf '%s' "$health" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version") or "")' 2>/dev/null || true)
            migrations_ok=$(printf '%s' "$health" | python3 -c 'import sys,json; print(str(json.load(sys.stdin).get("migrations",{}).get("ok")).lower())' 2>/dev/null || true)
            workers=$(printf '%s' "$health" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("workers") or 0)' 2>/dev/null || echo 0)
            echo "attempt $i: version=${version:-none} migrations_ok=${migrations_ok:-none} workers=${workers:-0}"
            if [ "$version" = "$expected" ] && [ "$migrations_ok" = "true" ] && [ "$workers" -ge 1 ]; then
              break
            fi
            sleep 10
          done
          if [ "$version" != "$expected" ] || [ "$migrations_ok" != "true" ] || [ "$workers" -lt 1 ]; then
            echo "::error::production health did not reach version $expected with current migrations and a live worker"
            printf '%s\n' "$health"
            exit 1
          fi
          bash scripts/prod-smoke.sh
          bash deploy/check-upload-limit.sh "$PUBLIC_URL"
