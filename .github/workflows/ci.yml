name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm learning:check
      - run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          APP_URL: http://localhost:3000
      - run: pnpm build:worker
      - run: pnpm audit --prod --audit-level=high

  images:
    name: Docker images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build web/worker image
        run: docker build -t pauoj/app:ci .
      - name: Build judge image
        run: docker build -t pauoj/judge:ci judge
      - name: Verify judge toolchain
        run: |
          docker run --rm pauoj/judge:ci sh -c \
            'g++ --version | head -n 1 && python3 --version && javac -version && node --version && test -s /harness.py'
